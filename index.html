<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure - چیرۆکی بیرکاری</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: var(--primary); }
        .problem { font-size: 2.5rem; margin: 20px 0; color: var(--accent); }
        input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        button:hover { background-color: var(--primary-hover); }
        .score { margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سەرکێشی بیرکاری</h1>
        <div class="problem" id="problem">5 + 3 = ?</div>
        <input type="number" id="answer" placeholder="وەڵامەکەت لێرە بنووسە...">
        <button onclick="checkAnswer()">پشکنین</button>
        <div class="score">نمرە: <span id="scoreVal">0</span></div>
    </div>

    <script>
        let num1 = 5, num2 = 3, score = 0;
        function generate() {
            num1 = Math.floor(Math.random() * 10) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            document.getElementById('problem').innerText = ${num1} + ${num2} = ?;
            document.getElementById('answer').value = '';
        }
        function checkAnswer() {
            let val = parseInt(document.getElementById('answer').value);
            if(val === num1 + num2) {
                score += 10;
                document.getElementById('scoreVal').innerText = score;
                generate();
            } else {
                alert("وەڵامەکە هەڵەیە، دووبارە هەوڵ بدەرەوە!");
            }
        }
    </script>
</body>
</html>
